<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard">

        <header class="header">
            <h1>My Dashboard</h1>
        </header>

        <aside class="sidebar">
            <h2>Menu</h2>

            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <main class="main">

            <div class="card">
                <span class="icon">👤</span>
                <div>
                    <h3>120</h3>
                    <p>Users</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">💰</span>
                <div>
                    <h3>Rs 45k</h3>
                    <p>Sales</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">📦</span>
                <div>
                    <h3>36</h3>
                    <p>Orders</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">⭐</span>
                <div>
                    <h3>4.8</h3>
                    <p>Rating</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">💬</span>
                <div>
                    <h3>18</h3>
                    <p>Messages</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">✅</span>
                <div>
                    <h3>92%</h3>
                    <p>Done</p>
                </div>
            </div>

        </main>

        <footer class="footer">
            Made with CSS Grid
        </footer>

    </div>

</body>

</html>
