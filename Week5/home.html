<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club</title>
    <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rl="stylesheet">


    <style>

     /* - Universal Selector */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #f2f4fa;
            font-family:'Poppins', sans-serif; /*GoogleFont */
            line-height:1.6; /* Line Height */
            padding:20px;
        }

        /*- ID Selector */
        #hero{
            background-color: royalblue;
            color: white;
            text-align: center;
            padding: 40px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /*- Element Selector */
        h1{
            font-size: 40px; /* Font Size */
        }

        /* - Class Selector */
        .card{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
         h2{
            color:#333;
            font-size:28px;
        }

        p{
            font-size:16px;
        }
    </style>

</head>

<body>
     <div id="hero">
        <h1>Tech Club</h1>
        <p>Learn. Code. Grow.</p>
    </div>

    <div class="card">
        <h2>Upcoming Events</h2>
        <p>HTML Workshop</p>
    </div>
    
</body>
</html>
