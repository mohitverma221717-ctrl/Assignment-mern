<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club</title>
    <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rl="stylesheet">


    <style>
        :root{
        --primary-color: #3659e3;
        --background-color: #f2f4fa;
        --card-bg: #ffffff;
        --text-color: #333333;

        --spacing-small: 10px;
        --spacing-medium: 20px;
        --spacing-large: 40px;
    }



     /* - Universal Selector */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: var(--background-color);
            font-family:'Poppins', sans-serif; /*GoogleFont */
            line-height:1.6; /* Line Height */
            padding: var(--spacing-medium);
        }

        /*- ID Selector */
        #hero{
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: var(--spacing-large);
            border-radius: 10px;
            margin-bottom: var(--spacing-medium);
        }

        /*- Element Selector */
        h1{
            font-size: 40px; /* Font Size */
        }

        /* - Class Selector */
        .card{
            background-color: var(--card-bg);
            padding: var(--spacing-medium);
            border-radius: 10px;
            margin-bottom: var(--spacing-medium);
        }
         h2{
            color: var(--text-color);
            font-size:28px;
            margin-bottom: var(--spacing-small);
        }

        p{
            color: var(--text-color);
            font-size:16px;
        }
    </style>

</head>

<body>
     <div id="hero">
        <h1>Tech Club</h1>
        <p>Learn. Code. Grow.</p>
    </div>

    <div class="card">
        <h2>Upcoming Events</h2>
        <p>HTML Workshop</p>
    </div>
    
</body>
</html>
