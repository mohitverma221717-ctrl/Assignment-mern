<!DOCTYPE html>
<html>
<head>
    <title>Tech Club</title>

    <style>

        body{
            background-color:#f2f4fa;
            font-family:Arial,sans-serif;
        }

    </style>

</head>
<body>

    <div id="hero">
        <h1>Tech Club</h1>
        <p>Learn. Code. Grow.</p>
    </div>

    <div class="card">
        <h2>Upcoming Events</h2>

        <table>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>

            <tr>
                <td>HTML Workshop</td>
                <td>12 Nov</td>
                <td>Lab 1</td>
            </tr>

            <tr>
                <td>Hackathon</td>
                <td>20 Nov</td>
                <td>Seminar Hall</td>
            </tr>
        </table>
    </div>

    <div class="card">
        <h2>Register</h2>

        <form>
            Name:
            <input type="text" placeholder="Your name">
            <br><br>

            Email:
            <input type="email" placeholder="you@example.com">
            <br><br>

            <button>Register</button>
        </form>
    </div>

</body>
</html>
